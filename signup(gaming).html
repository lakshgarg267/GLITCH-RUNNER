<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Core - Cyber Interface</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --bg-dark: #05050a;
            --card-bg: rgba(6, 6, 14, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Canvas Particle Background */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: all;
        }

        /* Ambient scanline and vignette effects */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* Main Hologram Container */
        .cyber-wrapper {
            position: relative;
            width: 450px;
            padding: 40px;
            background: var(--card-bg);
            z-index: 5;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.2), inset 0 0 20px rgba(0, 243, 255, 0.1);
            /* Sci-fi Angular Corners using Clip-path */
            clip-path: polygon(0 0, 85% 0, 100% 15%, 100% 100%, 15% 100%, 0 85%);
            transition: all 0.5s ease;
        }

        /* Tech Corner Decals */
        .cyber-wrapper::before {
            content: 'SYSTEM_AUTH_v4.2';
            position: absolute;
            top: 5px;
            right: 50px;
            font-size: 10px;
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            opacity: 0.6;
            letter-spacing: 2px;
        }

        /* Glitch Title Effect */
        .glitch-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            color: #fff;
            position: relative;
            margin-bottom: 30px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        /* Futuristic Input Layout */
        .cyber-input-box {
            position: relative;
            margin-bottom: 25px;
        }

        .cyber-input-box input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 243, 255, 0.3);
            outline: none;
            color: #fff;
            font-size: 1.2rem;
            letter-spacing: 1px;
            clip-path: polygon(0 0, 93% 0, 100% 30%, 100% 100%, 0 100%);
            transition: all 0.3s ease;
        }

        .cyber-input-box input:focus {
            border-color: var(--neon-pink);
            background: rgba(255, 0, 85, 0.05);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
        }

        .cyber-input-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-cyan);
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        .cyber-input-box input:focus ~ i {
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
        }

        /* Cyberpunk Cutting Edge Button */
        .cyber-btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% 70%, 88% 100%, 0 100%);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .cyber-btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 30px var(--neon-cyan);
            font-weight: 900;
        }

        .cyber-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }

        .cyber-btn:hover::before {
            left: 100%;
        }

        /* Toggle State Controls */
        .switch-mode-text {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 1rem;
        }

        .switch-link {
            color: var(--neon-pink);
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 0 0 5px rgba(255, 0, 85, 0.4);
        }

        .switch-link:hover {
            color: #fff;
            text-shadow: 0 0 10px var(--neon-pink);
        }

        /* Hidden elements for state change */
        .signup-field {
            max-height: 0;
            opacity: 0;
            margin-bottom: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cyber-wrapper.signup-active .signup-field {
            max-height: 80px;
            opacity: 1;
            margin-bottom: 25px;
        }

        .cyber-wrapper.signup-active {
            border-color: var(--neon-pink);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.2);
        }
        
        .cyber-wrapper.signup-active .cyber-btn {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }
        .cyber-wrapper.signup-active .cyber-btn:hover {
            background: var(--neon-pink);
            color: white;
            box-shadow: 0 0 30px var(--neon-pink);
        }
    </style>
</head>
<body>

    <!-- Dynamic JavaScript Particle Mesh Network -->
    <canvas id="particle-canvas"></canvas>

    <!-- Sci-Fi Login/Signup Box -->
    <div class="cyber-wrapper" id="auth-card">
        <h2 class="glitch-title" id="form-title">INITIALIZE_</h2>
        
        <form id="cyber-form" autocomplete="off" onsubmit="event.preventDefault();">
            
            <!-- Hidden by default, slides out smoothly on Signup -->
            <div class="cyber-input-box signup-field">
                <input type="text" id="user-name" placeholder="USER_NAME">
                <i class="fas fa-id-badge"></i>
            </div>

            <div class="cyber-input-box">
                <input type="email" id="user-email" placeholder="SECURE_EMAIL" required>
                <i class="fas fa-terminal"></i>
            </div>

            <div class="cyber-input-box">
                <input type="password" id="user-pass" placeholder="ACCESS_PASS" required>
                <i class="fas fa-key"></i>
            </div>

            <button type="submit" class="cyber-btn" id="submit-btn">ACCESS CORE</button>
        </form>

        <div class="switch-mode-text">
            <span id="switch-prompt">NEW USER?</span> 
            <span class="switch-link" id="toggle-mode">CREATE ID</span>
        </div>
    </div>

    <!-- Core Scripting Logic -->
    <script>
        // --- PARTICLE MESH ENGINE ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const mouse = { x: null, y: null, radius: 150 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.radius = Math.random() * 2 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                // Mouse Interaction
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.hypot(dx, dy);
                if (distance < mouse.radius) {
                    this.x -= dx * 0.02;
                    this.y -= dy * 0.02;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = document.getElementById('auth-card').classList.contains('signup-active') ? '#ff0055' : '#00f3ff';
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 100; i++) particles.push(new Particle());
        }
        initParticles();

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            
            // Draw lines between close particles
            for (let i = 0; i < particles.length; i++) {
                for (let j = i; j < particles.length; j++) {
                    let dist = Math.hypot(particles[i].x - particles[j].x, particles[i].y - particles[j].y);
                    if (dist < 100) {
                        ctx.strokeStyle = document.getElementById('auth-card').classList.contains('signup-active') ? `rgba(255, 0, 85, ${1 - dist/100})` : `rgba(0, 243, 255, ${1 - dist/100})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();


        // --- DYNAMIC INTERFACE TOGGLE ---
        const toggleLink = document.getElementById('toggle-mode');
        const card = document.getElementById('auth-card');
        const title = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const switchPrompt = document.getElementById('switch-prompt');
        const nameInput = document.getElementById('user-name');

        toggleLink.addEventListener('click', () => {
            card.classList.toggle('signup-active');
            
            if(card.classList.contains('signup-active')) {
                title.innerText = "REGISTER_ID";
                submitBtn.innerText = "BUILD PROFILE";
                switchPrompt.innerText = "EXISTING USER?";
                toggleLink.innerText = "LOG_IN";
                nameInput.setAttribute('required', 'true');
            } else {
                title.innerText = "INITIALIZE_";
                submitBtn.innerText = "ACCESS CORE";
                switchPrompt.innerText = "NEW USER?";
                toggleLink.innerText = "CREATE ID";
                nameInput.removeAttribute('required');
            }
        });
    </script>
</body>
</html>
